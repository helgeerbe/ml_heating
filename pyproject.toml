[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_heating"
version = "0.1.0"
description = "Machine Learning Heating Control System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ML Heating Contributors"}
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
# reactivex (rxpy) still calls the deprecated datetime.utcfromtimestamp() in
# its own internals (reactivex/internal/constants.py: UTC_ZERO = ...). We
# cannot fix third-party source, so suppress only that specific, noisy
# DeprecationWarning to keep test output clean. Our own datetime usage is
# timezone-aware UTC (see the Pass B UTC audit).
filterwarnings = [
    "ignore:.*utcfromtimestamp.*:DeprecationWarning:reactivex.*",
]
